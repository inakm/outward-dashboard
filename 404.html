<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f8fa">
  <title>404 — SkyLimit Outwards Dashboard</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="canonical" href="https://inakm.github.io/outward-dashboard/">
  <style>
    body { margin: 0; font-family: Inter, -apple-system, Segoe UI, Roboto, sans-serif; background: #f7f8fa; color: #1f2328; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { text-align: center; max-width: 420px; }
    .code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 64px; font-weight: 700; line-height: 1; margin: 0 0 12px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; color: #637083; margin: 0 0 24px; line-height: 1.5; }
    a { display: inline-block; background: #2f6fed; color: #fff; text-decoration: none; font-size: 14px; font-weight: 600; padding: 10px 20px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>That page doesn't exist on the SkyLimit Outwards Dashboard. The dashboard lives at a single address.</p>
      <a href="/outward-dashboard/">Back to the dashboard</a>
    </div>
  </div>
</body>
</html>
